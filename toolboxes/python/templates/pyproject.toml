[project]
name = "my-python-project"
version = "0.1.0"
description = "my desc"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Jesse Nieboer", email = "jessenieboer@protonmail.com"}
]

dependencies = []

[dependency-groups]
test = ["pytest>=8.0"]
dev = [
  {include-group = "test"},
