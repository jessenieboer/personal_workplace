inputs:
  gherkin-guidelines:
    flake: false
    url: github:AutomationPanda/gherkin-guidelines-for-ai
  llm-agents:
    url: github:numtide/llm-agents.nix
  nixpkgs:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
  nixpkgs-python:
    url: github:cachix/nixpkgs-python
    inputs:
      nixpkgs:
        follows: nixpkgs
  personal_workplace:
    flake: false
    url: github:jessenieboer/personal_workplace/jn
    
imports:
  - personal_workplace/toolboxes/ai
  - personal_workplace/toolboxes/bdd
  - personal_workplace/toolboxes/emacs
  - personal_workplace/toolboxes/git
  - personal_workplace/toolboxes/readme
  - personal_workplace/toolboxes/secrets
  - personal_workplace/toolboxes/voxtype

nixpkgs:
  permitted_unfree_packages:
    - bws
