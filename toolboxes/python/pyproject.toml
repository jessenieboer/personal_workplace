[project]
name = "my-python-project"
version = "0.1.0"
description = "my desc"
# readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "Jesse Nieboer", email = "jessenieboer@protonmail.com"}
]

dependencies = []

[dependency-groups]
lint = ["ruff>=0.9", "ty"]
test = ["pytest>=8.0", "pytest-cov>=6.0"]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
]

# Enable when this repo is a package you intend to build:
# [build-system]
# requires = ["uv_build"]
# build-backend = "uv_build"

# [project.scripts]
# command_name = "module.path:function"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  ".devenv",
  ".direnv",
  ".toolboxes",
  ".venv",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "ISC001"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

[tool.pytest.ini_options]
addopts = [
  "--cov=src",
  "--color=yes",
]
python_files = ["*_test.py", "test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
testpaths = ["tests"]

# markers = [
#   "base: Tests for base cases",
#   "normal: Tests for normal behavior",
#   "abnormal: Tests for bad input and errors",
# ]
