inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
  personal_workplace:
    flake: false
    url: github:jessenieboer/personal_workplace/jn
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs

imports:
  - personal_workplace/toolboxes/git
  - personal_workplace/toolboxes/readme
  - personal_workplace/toolboxes/secrets

nixpkgs:
  permitted_unfree_packages:
    - bws
