# Smoke consumer for the code toolbox.
# Import only the toolbox under test; its devenv.yaml pulls the rest.
imports:
  - /toolboxes/code

# devenv does not merge nixpkgs unfree policy from imported toolboxes.
# secrets ships pkgs.bws (unfree); permit it on this project root.
nixpkgs:
  permitted_unfree_packages:
    - bws
